<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tandem — live demo</title>
<style>
:root{
  --paper:#F2F5F4; --card:#FFFFFF; --ink:#141C19; --soft:#5E6B65; --rule:#E2E8E6;
  --a:#1F6F63; --b:#7A4E9B; --warn:#C0553F; --ok:#2E7D5B; --amber:#B8863B;
  --tintA:rgba(31,111,99,.09); --tintB:rgba(122,78,155,.09);
  --r:14px;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,28,25,.04), 0 8px 24px -12px rgba(20,28,25,.10);
}
[data-theme="dark"]{
  --paper:#101614; --card:#19211F; --ink:#E9EFED; --soft:#93A29C; --rule:#293431;
  --a:#4FB39F; --b:#B189CE; --warn:#E08265; --ok:#5BBE8F; --amber:#D6A860;
  --tintA:rgba(79,179,159,.13); --tintB:rgba(177,137,206,.13);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--sans);
     font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--serif); font-weight:normal; margin:0}
svg{display:block}

/* ---------- shell ---------- */
#app{display:flex; min-height:100vh}
.rail{width:230px; flex:0 0 230px; border-right:1px solid var(--rule);
      padding:24px 14px; position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--card)}
.brand{font-family:var(--serif); font-size:23px; padding:0 10px 1px}
.brandsub{font-size:11px; color:var(--soft); padding:0 10px 22px; letter-spacing:.03em}
.navitem{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none;
         border:0; padding:9px 10px; border-radius:10px; color:var(--soft); font-size:14px; margin-bottom:2px}
.navitem:hover{background:rgba(127,127,127,.08); color:var(--ink)}
.navitem[aria-current="true"]{background:var(--tintA); color:var(--ink); font-weight:500}
.navitem[aria-current="true"] svg{color:var(--a)}
main{flex:1; min-width:0; padding:0 30px 100px; max-width:1080px}


/* ---------- the header band ---------- */
.band{background:linear-gradient(105deg,var(--a) 0%,var(--a) 42%,var(--b) 100%);
      margin:0 -30px; padding:26px 30px 28px; color:#fff; position:relative; overflow:hidden}
.band:after{content:""; position:absolute; right:-60px; top:-70px; width:260px; height:260px;
            border-radius:50%; background:rgba(255,255,255,.07)}
.band h1{font-size:29px; line-height:1.15; letter-spacing:-.005em}
.band p{margin:5px 0 0; font-size:13.5px; color:rgba(255,255,255,.82); max-width:62ch}
.bandwrap{margin-bottom:22px}

.eyebrow{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--soft)}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--rule); border-radius:var(--r);
      padding:22px; box-shadow:var(--shadow)}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.label{font-size:12.5px; color:var(--soft)}

.hero{padding:30px 26px 26px; border-top:3px solid transparent;
      border-image:linear-gradient(90deg,var(--a),var(--b)) 1}
.hero .num{font-family:var(--serif); font-size:58px; line-height:1.02; letter-spacing:-.02em; margin-top:2px}
.hero .msg{color:var(--soft); font-size:14px; margin-top:10px; max-width:60ch}
.splitbar{display:flex; height:9px; border-radius:5px; overflow:hidden; margin-top:20px}
.splitbar i{display:block}
.splitkey{display:flex; gap:20px; margin-top:10px; font-size:12.5px; color:var(--soft); flex-wrap:wrap}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:0}

.mine{border-top:3px solid var(--a)}
.theirs{border-top:3px solid var(--b)}
.ours{border-top:3px solid transparent; border-image:linear-gradient(90deg,var(--a),var(--b)) 1}
.pnum{font-family:var(--serif); font-size:32px; margin-top:5px; line-height:1.1}

/* icon chip */
.chip{width:36px; height:36px; border-radius:11px; display:flex; align-items:center;
      justify-content:center; background:var(--tintA); color:var(--a); flex:0 0 36px}
.chip.p{background:var(--tintB); color:var(--b)}
.chiprow{display:flex; align-items:center; gap:12px; margin-bottom:12px}

/* ---------- rows ---------- */
.row{display:flex; align-items:center; gap:13px; padding:13px 0;
     border-bottom:1px solid var(--rule); font-size:14px}
.row:last-child{border-bottom:0}
.row .gr{flex:1; min-width:0}
.row .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .meta{font-size:12px; color:var(--soft); margin-top:1px}
.amt{font-family:var(--serif); font-size:18px; white-space:nowrap}
.tag{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--tintA);
     color:var(--a); white-space:nowrap; border:0}
.tag.n{background:rgba(127,127,127,.1); color:var(--soft)}
.edge{width:3px; align-self:stretch; border-radius:2px; flex:0 0 3px; background:var(--rule)}
.edge.a{background:var(--a)} .edge.b{background:var(--b)}
.edge.o{background:linear-gradient(var(--a),var(--b))}

/* ---------- controls ---------- */
.btn{background:var(--ink); color:var(--paper); border:0; border-radius:10px;
     padding:10px 16px; font-size:13.5px; display:inline-flex; align-items:center; gap:7px}
.btn.ghost{background:none; color:var(--ink); border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--a); color:var(--a)}
.btn.sm{padding:6px 11px; font-size:12.5px; border-radius:8px}
input,select{background:var(--card); border:1px solid var(--rule); border-radius:10px;
             padding:10px 12px; width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--a); outline-offset:1px}
.field{margin-bottom:11px}
.field .label{display:block; margin-bottom:5px}
.inline{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.inline > *{flex:1; min-width:120px}
.inline .btn{flex:0 0 auto}

/* ---------- misc ---------- */
.sechead{display:flex; justify-content:space-between; align-items:center; margin:28px 0 12px}
.sechead h2{font-size:20px}
.note{font-size:13px; color:var(--soft)}
.flag{background:rgba(184,134,59,.10); border-left:3px solid var(--amber);
      padding:12px 15px; border-radius:8px; font-size:13.5px; margin-top:14px; color:var(--ink)}
.flag b{font-weight:600}
.flag.bad{background:rgba(192,85,63,.10); border-left-color:var(--warn)}
.good{background:rgba(46,125,91,.10); border-left-color:var(--ok)}
.bars{display:flex; align-items:flex-end; gap:2px; height:74px; margin-top:14px}
.bars i{flex:1; background:var(--a); border-radius:2px 2px 0 0; opacity:.55; min-height:1px}
.bars i.neg{background:var(--warn); opacity:.85}
.bars i.pay{opacity:1}
.track{height:8px; background:rgba(127,127,127,.14); border-radius:5px; overflow:hidden; margin-top:9px}
.track i{display:block; height:100%; border-radius:5px}
.trackends{display:flex; justify-content:space-between; font-size:11.5px; color:var(--soft); margin-top:6px}
.empty{text-align:center; padding:38px 18px; color:var(--soft); font-size:14px}
.tabbar{display:none}
.ver{font-size:11px; color:var(--soft); padding:18px 10px 0}

/* toast */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
       background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:24px;
       font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .22s, transform .22s;
       z-index:40; box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width:820px){
  #app{display:block}
  .rail{display:none}
  main{padding:0 16px 104px; max-width:none}
  .band{margin:0 -16px; padding:20px 16px 22px}
  .band h1{font-size:23px}
  .g2,.g3{grid-template-columns:1fr}
  .hero .num{font-size:46px}
  .tabbar{display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--card);
          border-top:1px solid var(--rule); padding:5px 2px; z-index:30; overflow-x:auto}
  .tabbar .navitem{flex-direction:column; gap:3px; text-align:center; font-size:10px;
                   padding:7px 6px; white-space:nowrap; flex:1; justify-content:center}
  #toast{bottom:78px}
}
@media (max-width:560px){
  .row{flex-wrap:wrap; gap:9px}
  .row .gr{flex:1 1 100%}
  .row .amt{order:2}
  .row .tag{order:1}
  .row .btn{order:3; margin-left:auto}
}
.chartwrap{margin-top:12px; overflow:hidden}
.chartwrap svg{display:block; width:100%; height:auto}
.gridline{stroke:var(--rule); stroke-width:1}
.axis{fill:var(--soft); font-size:10px; font-family:inherit}
.zeroline{stroke:var(--warn); stroke-width:1; stroke-dasharray:3 3; opacity:.7}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-top:12px}
.calh{font-size:10.5px; color:var(--soft); text-align:center; padding:2px 0}
.cald{border:1px solid var(--rule); border-radius:7px; min-height:52px; padding:5px 6px;
      font-size:11.5px; color:var(--soft); position:relative}
.cald.pad{border-color:transparent}
.cald.now{border-color:var(--ink); border-width:1.5px}
.cald b{font-weight:600; color:var(--ink)}
.cald .mk{display:flex; gap:3px; flex-wrap:wrap; margin-top:4px}
.cald .mk i{width:7px; height:7px; border-radius:50%; display:block}
.callegend{display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:12.5px; color:var(--soft)}
@media (max-width:560px){
  .cald{min-height:42px; padding:3px 4px; font-size:10.5px}
  .cald .mk i{width:6px; height:6px}
}
.demobar{background:var(--card); border:1px solid var(--rule); border-left:3px solid var(--b);
  border-radius:10px; padding:11px 14px; margin-bottom:18px; font-size:13.5px; line-height:1.45}
@media print{
  .rail,.tabbar,.btn,.sample,#toast{display:none!important}
  body{background:#fff}
  .band{background:#fff!important; color:#000!important; padding-left:0}
  .band h1,.band p{color:#000!important}
  .card{break-inside:avoid; border-color:#ccc; box-shadow:none}
}
@media (prefers-reduced-motion:reduce){
  #toast{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <aside class="rail">
    <div class="brand"><b>Tandem</b></div>
    <div class="brandsub">Two incomes, one clear number</div>
    <nav id="nav"></nav>
    <div class="ver">v1.0 · live demo</div>
  </aside>
  <main>
    <div id="view"></div>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============ storage ============ */
var KEY="tandem.v1";
var SCREENS=[
  ["today","Today"],["arrive","When money arrives"],["bills","Bills coming up"],
  ["share","Who pays what"],["spent","Where it went"],["goals","What we're saving for"],
  ["owe","What we still owe"],["settings","Settings"]
];

function blank(){
  return {
    version:1, sample:false, screen:"today",
    people:[{id:"a",name:"Maya"},{id:"b",name:"Sam"}],
    settings:{currency:"$",theme:"light",buffer:250,split:"ratio"},
    balances:{joint:0,a:0,b:0},
    allowance:{a:0,b:0},
    income:[], bills:[], txns:[], goals:[], debts:[]
  };
}

function sample(){
  var s=blank(); s.sample=true;
  var t=new Date(); var yr=t.getFullYear(), mo=t.getMonth();
  function d(day){ return iso(new Date(yr,mo,day)); }
  s.balances={joint:2140,a:610,b:445};
  s.allowance={a:400,b:400};
  s.income=[
    {id:"i1",owner:"a",label:"Clinic salary",amount:1680,cycle:"biweekly",next:d(Math.min(t.getDate()+4,28))},
    {id:"i2",owner:"b",label:"Agency salary",amount:3250,cycle:"monthly",next:d(28)}
  ];
  s.bills=[
    {id:"b1",name:"Rent",amount:1450,day:1,pot:"joint",split:"ratio",paidBy:""},
    {id:"b2",name:"Electricity",amount:118,day:8,pot:"joint",split:"ratio",paidBy:""},
    {id:"b3",name:"Internet",amount:60,day:12,pot:"joint",split:"half",paidBy:""},
    {id:"b4",name:"Groceries standing order",amount:520,day:3,pot:"joint",split:"ratio",paidBy:""},
    {id:"b5",name:"Car insurance",amount:96,day:15,pot:"joint",split:"half",paidBy:""},
    {id:"b6",name:"Maya's phone",amount:29,day:6,pot:"a",split:"one",paidBy:"a"},
    {id:"b7",name:"Sam's gym",amount:42,day:10,pot:"b",split:"one",paidBy:"b"}
  ];
  s.txns=[
    {id:"t1",date:d(Math.max(1,t.getDate()-1)),amount:64.20,cat:"Groceries",pot:"joint",by:"a"},
    {id:"t2",date:d(Math.max(1,t.getDate()-2)),amount:18.50,cat:"Coffee",pot:"a",by:"a"},
    {id:"t3",date:d(Math.max(1,t.getDate()-2)),amount:112.00,cat:"Dog vet",pot:"joint",by:"b"},
    {id:"t4",date:d(Math.max(1,t.getDate()-4)),amount:35.00,cat:"Books",pot:"b",by:"b"},
    {id:"t5",date:d(Math.max(1,t.getDate()-5)),amount:88.40,cat:"Groceries",pot:"joint",by:"a"}
  ];
  s.goals=[
    {id:"g1",name:"Emergency fund",target:9000,saved:5400,monthly:300,shared:true,owner:"",date:""},
    {id:"g2",name:"Trip to Lisbon",target:3200,saved:980,monthly:180,shared:true,owner:"",date:""},
    {id:"g3",name:"Maya's laptop",target:1400,saved:520,monthly:90,shared:false,owner:"a",date:""}
  ];
  s.debts=[
    {id:"d1",name:"Credit card",balance:3180,apr:22.9,min:140,owner:"joint"},
    {id:"d2",name:"Sam's student loan",balance:8600,apr:4.9,min:210,owner:"b"}
  ];
  return s;
}

var DEMO=true; var S=sample();
function load(){
  try{ var r=localStorage.getItem(KEY); if(r) return Object.assign(blank(),JSON.parse(r)); }catch(e){}
  return blank();
}
function save(){ /* demo build: nothing is written to this device */ }

/* ============ helpers ============ */
function iso(d){ return d.toISOString().slice(0,10); }
function period(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2); }
function billPaidFor(b,d){ return !!b.paidBy && b.paidPeriod===period(d); }
function today(){ var t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function parse(s){ var p=String(s||"").split("-"); return new Date(+p[0],(+p[1]||1)-1,+p[2]||1); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function money(n){
  var c=S.settings.currency||"$"; var neg=n<0; n=Math.abs(n);
  return (neg?"-":"")+c+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function money0(n){
  var c=S.settings.currency||"$"; var neg=n<0; n=Math.abs(n);
  return (neg?"-":"")+c+Math.round(n).toLocaleString();
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]; }); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function person(id){ for(var i=0;i<S.people.length;i++) if(S.people[i].id===id) return S.people[i]; return {id:id,name:id}; }
function nameOf(id){ return person(id).name || (id==="a"?"Person A":"Person B"); }
function colourOf(id){ return id==="a"?"var(--a)":id==="b"?"var(--b)":"var(--soft)"; }

/* ---- pay cycles ---- */
var PER_YEAR={weekly:52,biweekly:26,semimonthly:24,monthly:12};
function monthlyAmount(s){ return (s.amount*(PER_YEAR[s.cycle]||12))/12; }

/* every payday for one stream between two dates */
function paydays(stream,from,to){
  var out=[], d=parse(stream.next), anchor=parse(stream.next).getDate(), a2=+stream.day2||0, guard=0;
  while(d<from && guard++<400) d=stepPay(d,stream.cycle,anchor,a2);
  /* the stored date is the NEXT payday, so walk back to reach earlier ones */
  guard=0;
  while(d>from && guard++<400){
    var prev=stepBack(d,stream.cycle,anchor,a2);
    if(prev<from || !(prev<d)) break;
    d=prev;
  }
  guard=0;
  while(d<=to && guard++<400){ out.push(new Date(d)); d=stepPay(d,stream.cycle,anchor,a2); }
  return out;
}
function lastDayOf(y,m){ return new Date(y,m+1,0).getDate(); }
/* the pair of days a semi-monthly wage lands on, derived once from the anchor */
function semiPair(a,b){
  a=Math.min(Math.max(a||1,1),31);
  if(b){ b=Math.min(Math.max(b,1),31); }
  else { b=a+15; if(b>31) b=a-15; if(b<1) b=a+14; }   /* only for data saved before day2 existed */
  if(a===b) b=(a>15?a-15:a+15);
  return a<b?[a,b]:[b,a];
}
function onDay(y,m,day){ return new Date(y,m,Math.min(day,lastDayOf(y,m))); }
function stepBack(d,cycle,anchor,anchor2){
  var x=new Date(d), y=x.getFullYear(), m=x.getMonth(), cur=x.getDate();
  if(cycle==="weekly"){ x.setDate(cur-7); return x; }
  if(cycle==="biweekly"){ x.setDate(cur-14); return x; }
  if(cycle==="semimonthly"){
    var p=semiPair(anchor||cur,anchor2), lo=p[0], hi=p[1];
    if(cur>Math.min(hi,lastDayOf(y,m))) return onDay(y,m,hi);
    if(cur>Math.min(lo,lastDayOf(y,m))) return onDay(y,m,lo);
    return onDay(y,m-1,hi);
  }
  return onDay(y,m-1,anchor||cur);
}
function stepPay(d,cycle,anchor,anchor2){
  var x=new Date(d), y=x.getFullYear(), m=x.getMonth(), cur=x.getDate();
  if(cycle==="weekly"){ x.setDate(cur+7); return x; }
  if(cycle==="biweekly"){ x.setDate(cur+14); return x; }
  if(cycle==="semimonthly"){
    var p=semiPair(anchor||cur,anchor2), lo=p[0], hi=p[1];
    if(cur<Math.min(lo,lastDayOf(y,m))) return onDay(y,m,lo);
    if(cur<Math.min(hi,lastDayOf(y,m))) return onDay(y,m,hi);
    return onDay(y,m+1,lo);
  }
  /* monthly: keep the anchor day, clamped to the length of each month, never overflowing */
  return onDay(y,m+1,anchor||cur);
}
function lastPayFor(ownerId){
  var t=today(), best=null;
  S.income.forEach(function(s){
    if(s.owner!==ownerId) return;
    var list=paydays(s,addDays(t,-95),t), l=list[list.length-1];
    if(l && (!best||l>best)) best=l;
  });
  return best;
}
function nextPayFor(ownerId){
  var t=today(), best=null;
  S.income.forEach(function(s){
    if(ownerId && s.owner!==ownerId) return;
    var p=paydays(s,t,addDays(t,400))[0];
    if(p && (!best || p<best)) best=p;
  });
  return best;
}

/* bills falling due between two dates, by pot */
function billsDue(from,to,pot){
  var out=[], t=new Date(from);
  S.bills.forEach(function(b){
    if(pot && b.pot!==pot) return;
    var d=new Date(from.getFullYear(),from.getMonth(),b.day||1);
    var guard=0;
    while(d<from && guard++<40) d=new Date(d.getFullYear(),d.getMonth()+1,b.day||1);
    guard=0;
    while(d<=to && guard++<40){
      if(!billPaidFor(b,d)) out.push({bill:b,when:new Date(d)});
      d=new Date(d.getFullYear(),d.getMonth()+1,b.day||1);
    }
  });
  out.sort(function(x,y){ return x.when-y.when; });
  return out;
}

/* ---- the signature calculation ---- */
function ourSafe(){
  var t=today(), next=nextPayFor(null)||addDays(t,30);
  var due=billsDue(t,next,"joint").reduce(function(a,x){ return a+ +x.bill.amount; },0);
  var p=period(t);
  var goals=S.goals.filter(function(g){ return g.shared && g.lastPaid!==p; })
                   .reduce(function(a,g){ return a+(+g.monthly||0); },0);
  var buffer=+S.settings.buffer||0;
  return {
    value:S.balances.joint-due-goals-buffer,
    balance:S.balances.joint, due:due, goals:goals, buffer:buffer, until:next
  };
}
function yourSafe(id){
  var t=today(), next=nextPayFor(id)||addDays(t,30);
  var due=billsDue(t,next,id).reduce(function(a,x){ return a+ +x.bill.amount; },0);
  /* count spending since this person was last paid, not since the 1st */
  var since=lastPayFor(id)||new Date(t.getFullYear(),t.getMonth(),1);
  var spent=S.txns.filter(function(x){ return x.pot===id && parse(x.date)>=since; })
                  .reduce(function(a,x){ return a+ +x.amount; },0);
  var allow=+S.allowance[id]||0;
  return { value:(allow?allow-spent:S.balances[id])-due, allow:allow, spent:spent, due:due, until:next };
}

/* ---- fair share ---- */
function fairShare(){
  var inc={a:0,b:0};
  S.income.forEach(function(s){ inc[s.owner]=(inc[s.owner]||0)+monthlyAmount(s); });
  var total=inc.a+inc.b;
  var ra=total?inc.a/total:.5;
  var joint=0, ratio={a:0,b:0}, half={a:0,b:0}, chosen={a:0,b:0}, paid={a:0,b:0}, shareOfPaid={a:0,b:0};
  S.bills.forEach(function(b){
    if(b.pot!=="joint") return;
    var amt=+b.amount||0;
    joint+=amt;
    ratio.a+=amt*ra;  ratio.b+=amt*(1-ra);
    half.a+=amt/2;    half.b+=amt/2;
    var rule=b.split||"default";
    if(rule==="default") rule=S.settings.split;
    var ca,cb;
    if(rule==="half"){ ca=amt/2; cb=amt/2; }
    else if(rule==="one"){ var o=b.owedBy||"a"; ca=o==="a"?amt:0; cb=amt-ca; }
    else if(rule==="custom"){ var pa=(b.pct==null?50:+b.pct)/100; ca=amt*pa; cb=amt*(1-pa); }
    else { ca=amt*ra; cb=amt*(1-ra); }
    chosen.a+=ca; chosen.b+=cb;
    if(billPaidFor(b,today())){
      paid[b.paidBy]+=amt;          /* what each person actually fronted */
      shareOfPaid.a+=ca; shareOfPaid.b+=cb;   /* what each owed on those same bills */
    }
  });
  /* positive means that person is owed money back */
  var net={a:paid.a-shareOfPaid.a, b:paid.b-shareOfPaid.b};
  return {inc:inc,total:total,joint:joint,ra:ra,ratio:ratio,half:half,chosen:chosen,paid:paid,
          shareOfPaid:shareOfPaid,net:net,owed:{a:chosen.a-paid.a,b:chosen.b-paid.b}};
}

/* ---- 45-day forecast ---- */
function forecast(days){
  days=days||45;
  var t=today(), bal=S.balances.joint, pts=[], low={v:bal,d:t}, thin=[];
  var end=addDays(t,days);
  var allPay=[];
  S.income.forEach(function(s){ paydays(s,t,end).forEach(function(d){ allPay.push({d:d,amt:+s.amount,owner:s.owner}); }); });
  var due=billsDue(t,end,"joint");
  for(var i=0;i<=days;i++){
    var day=addDays(t,i);
    allPay.forEach(function(p){ if(iso(p.d)===iso(day)) bal+=p.amt; });
    due.forEach(function(x){ if(iso(x.when)===iso(day)) bal-=+x.bill.amount; });
    pts.push({d:day,v:bal});
    if(bal<low.v){ low={v:bal,d:day}; }
  }
  /* flag weeks where nobody is paid, and weeks where only one of you is */
  var earners={};
  S.income.forEach(function(s){ earners[s.owner]=1; });
  var bothEarn=Object.keys(earners).length>1;
  for(var w=0;w<days-6;w+=7){
    var from=addDays(t,w), to=addDays(t,w+6), seen={};
    allPay.forEach(function(p){ if(p.d>=from&&p.d<=to) seen[p.owner]=1; });
    var who=Object.keys(seen);
    if(!who.length) thin.push({from:from,to:to,kind:"none"});
    else if(bothEarn && who.length===1) thin.push({from:from,to:to,kind:"one",who:who[0]});
  }
  return {pts:pts,low:low,thin:thin,end:bal};
}

/* ---- goal maths ---- */
function monthsToGoal(g,extra){
  var per=(+g.monthly||0)+(extra||0);
  if(per<=0) return null;
  var left=(+g.target||0)-(+g.saved||0);
  if(left<=0) return 0;
  return Math.ceil(left/per);
}
/* ---- debt maths: months to clear at the current payment ---- */
function monthsToClear(d){
  var bal=+d.balance||0, pay=+d.min||0, r=(+d.apr||0)/100/12, m=0;
  if(bal<=0) return 0;
  if(pay<=bal*r) return null; /* payment does not cover the interest */
  while(bal>0 && m<720){ bal=bal*(1+r)-pay; m++; }
  return m;
}
function inMonths(m){
  if(m==null) return "not on track";
  var d=new Date(); d.setMonth(d.getMonth()+m);
  return d.toLocaleDateString(undefined,{month:"long",year:"numeric"});
}
function dayLabel(d){ return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}); }

/* ---------- When money arrives ---------- */
function forecastChart(f){
  var W=700,H=200,L=56,R=10,T=12,B=24;
  var vals=f.pts.map(function(p){ return p.v; });
  var max=Math.max.apply(null,vals), min=Math.min.apply(null,vals);
  if(max===min){ max+=1; min-=1; }
  var pad=(max-min)*0.14; max+=pad; min-=pad;
  if(min>0) min=0;                       /* keep zero in view while in credit */
  var n=f.pts.length-1;
  function X(i){ return L+(i/n)*(W-L-R); }
  function Y(v){ return T+(1-(v-min)/(max-min))*(H-T-B); }

  var g="", steps=4;
  for(var k=0;k<=steps;k++){
    var v=min+((max-min)*k/steps), yy=Y(v);
    g+='<line class="gridline" x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'"/>'+
       '<text class="axis" x="'+(L-8)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end">'+money0(v)+'</text>';
  }

  var line=f.pts.map(function(p,i){ return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1); }).join(" ");
  var area=line+" L"+X(n).toFixed(1)+" "+Y(min).toFixed(1)+" L"+X(0).toFixed(1)+" "+Y(min).toFixed(1)+" Z";

  var zero = (min<0 && max>0)
    ? '<line class="zeroline" x1="'+L+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(0).toFixed(1)+'"/>' : "";

  /* a marker on every payday, in that person's colour */
  var marks="";
  S.income.forEach(function(s){
    paydays(s,today(),addDays(today(),45)).forEach(function(d){
      var i=Math.round((d-today())/86400000);
      if(i<0||i>n) return;
      marks+='<line x1="'+X(i).toFixed(1)+'" y1="'+T+'" x2="'+X(i).toFixed(1)+'" y2="'+(H-B)+'" '+
             'stroke="'+(s.owner==="a"?"var(--a)":"var(--b)")+'" stroke-width="1" opacity=".28"/>'+
             '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(f.pts[i].v).toFixed(1)+'" r="3.6" '+
             'fill="'+(s.owner==="a"?"var(--a)":"var(--b)")+'"><title>'+esc(nameOf(s.owner))+
             ' paid '+dayLabel(d)+'</title></circle>';
    });
  });

  var lowI=Math.round((f.low.d-today())/86400000);
  var lowDot = (lowI>=0&&lowI<=n)
    ? '<circle cx="'+X(lowI).toFixed(1)+'" cy="'+Y(f.low.v).toFixed(1)+'" r="4.5" fill="none" '+
      'stroke="'+(f.low.v<0?"var(--warn)":"var(--ink)")+'" stroke-width="1.6"/>' : "";

  return '<div class="chartwrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" '+
    'aria-label="Joint balance over the next 45 days">'+
    g+
    '<path d="'+area+'" fill="var(--a)" opacity=".10"/>'+
    '<path d="'+line+'" fill="none" stroke="var(--a)" stroke-width="2" stroke-linejoin="round"/>'+
    zero+marks+lowDot+
    '<text class="axis" x="'+L+'" y="'+(H-6)+'">'+dayLabel(today())+'</text>'+
    '<text class="axis" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+dayLabel(addDays(today(),45))+'</text>'+
  '</svg></div>';
}

/* a month at a glance: paydays and bills on the days they land */
function monthCalendar(){
  var t=today(), y=t.getFullYear(), m=t.getMonth();
  var days=lastDayOf(y,m), lead=new Date(y,m,1).getDay();
  var pay={}, bil={};
  S.income.forEach(function(s){
    paydays(s,new Date(y,m,1),new Date(y,m,days)).forEach(function(d){
      (pay[d.getDate()]=pay[d.getDate()]||[]).push(s.owner);
    });
  });
  S.bills.forEach(function(b){
    var day=Math.min(b.day||1,days);
    (bil[day]=bil[day]||[]).push(b);
  });

  var cells="";
  for(var i=0;i<lead;i++) cells+='<div class="cald pad"></div>';
  for(var d=1;d<=days;d++){
    var mk="";
    (pay[d]||[]).forEach(function(o){ mk+='<i style="background:'+(o==="a"?"var(--a)":"var(--b)")+'"></i>'; });
    (bil[d]||[]).forEach(function(b){ mk+='<i style="background:var(--rule);border:1px solid var(--soft)"></i>'; });
    var tips=[];
    (pay[d]||[]).forEach(function(o){ tips.push(nameOf(o)+" paid"); });
    (bil[d]||[]).forEach(function(b){ tips.push(b.name+" "+money0(b.amount)); });
    cells+='<div class="cald'+(d===t.getDate()?" now":"")+'"'+(tips.length?' title="'+esc(tips.join(", "))+'"':"")+'>'+
           '<b>'+d+'</b>'+(mk?'<div class="mk">'+mk+'</div>':"")+'</div>';
  }
  var names=["S","M","T","W","T","F","S"];
  return '<div class="cal">'+names.map(function(n){ return '<div class="calh">'+n+'</div>'; }).join("")+cells+'</div>'+
    '<div class="callegend">'+
      '<span><span class="dot" style="background:var(--a)"></span>'+esc(nameOf("a"))+' paid</span>'+
      '<span><span class="dot" style="background:var(--b)"></span>'+esc(nameOf("b"))+' paid</span>'+
      '<span><span class="dot" style="background:var(--rule);border:1px solid var(--soft)"></span>A bill is due</span>'+
    '</div>';
}

      pays.push({d:d,owner:s.owner,label:s.label,amt:s.amount});
    });
  });
  pays.sort(function(x,y){ return x.d-y.d; });

  return band("When money arrives","The next 45 days of your joint pot, with both of your paydays in it.")+
  '<div class="card">'+
    '<div class="label">Where the joint balance goes</div>'+
    forecastChart(f)+
    '<div class="splitkey">'+
      '<span><span class="dot" style="background:var(--a)"></span>'+esc(nameOf("a"))+' paid</span>'+
      '<span><span class="dot" style="background:var(--b)"></span>'+esc(nameOf("b"))+' paid</span>'+
      '<span><span class="dot" style="background:none;border:1.5px solid var(--ink)"></span>Lowest point</span>'+
    '</div>'+
    (function(){

      f.pts.forEach(function(p){ if(np && iso(p.d)===iso(np)) after=p.v; });
      var s='You are at <b>'+money(f.pts[0].v)+'</b> today. ';
      s+='You reach your lowest point of <b>'+money(f.low.v)+'</b> on <b>'+dayLabel(f.low.d)+'</b>';
      if(np && after!=null) s+=', then payday on '+dayLabel(np)+' lifts you back to <b>'+money(after)+'</b>.';

    })()+

      return '<div class="flag">'+(w.kind==="none"
        ? "No money arrives at all between "+dayLabel(w.from)+" and "+dayLabel(w.to)+". Worth holding something back."

  '<div class="card">'+monthCalendar()+'</div>'+
  '<div class="sechead"><h2>Paydays coming up</h2></div>'+
  '<div class="card">'+
    (pays.length? pays.map(function(p){
      return '<div class="row '+(p.owner==="a"?"mine":"theirs")+'"><div class="gr"><div class="nm">'+esc(p.label||nameOf(p.owner))+'</div>'+

    }).join("") : '<div class="empty">Add an income in Settings and this fills in.</div>')+
  '</div>';
}

/* ---------- Who pays what ---------- */
function splitLabel(b){
  var r=b.split||"default";
  if(r==="default") return "house rule";
  if(r==="half") return "50/50";
  if(r==="custom") return (b.pct==null?50:b.pct)+"/"+(100-(b.pct==null?50:b.pct));
  if(r==="one") return esc(nameOf(b.owedBy||"a"))+" only";
  return "by income";
}
function vShare(){
  var f=fairShare();
  if(!f.total) return band("Who pays what","")+'<div class="card"><div class="empty">Add both incomes in Settings and the split works itself out.</div></div>';
  var pa=Math.round(f.ra*100);
  var net=f.net.a;
  var settleLine = (f.paid.a+f.paid.b)<0.01
    ? "Nothing paid yet this month, so nobody owes anybody."
    : Math.abs(net)<0.01
      ? "You're square this month."
      : (net>0 ? esc(nameOf("b"))+" owes "+esc(nameOf("a"))+" "+money(net)
               : esc(nameOf("a"))+" owes "+esc(nameOf("b"))+" "+money(-net))+" to even up.";

  function col(id,label,v,note){
    return '<div class="card '+(id==="a"?"mine":"theirs")+'"><div class="label">'+label+'</div>'+
      '<div class="pnum" style="color:'+colourOf(id)+'">'+money(v)+'</div>'+
      '<div class="label" style="margin-top:6px">'+note+'</div></div>';
  }

  return band("Who pays what",money(f.joint)+" of shared bills a month, split the way the two of you choose.")+
  '<div class="card">'+
    '<div class="label">Split by what each of you earns</div>'+
    '<div class="splitbar" style="margin-top:12px"><i style="width:'+pa+'%;background:var(--a)"></i><i style="width:'+(100-pa)+'%;background:var(--b)"></i></div>'+
    '<div class="splitkey">'+
      '<span><span class="dot" style="background:var(--a)"></span>'+esc(nameOf("a"))+' · '+money0(f.inc.a)+' a month · '+pa+'%</span>'+
      '<span><span class="dot" style="background:var(--b)"></span>'+esc(nameOf("b"))+' · '+money0(f.inc.b)+' a month · '+(100-pa)+'%</span>'+
    '</div>'+
  '</div>'+

  '<div class="grid g2" style="margin-top:14px">'+
    col("a",esc(nameOf("a"))+"'s share by income",f.ratio.a,"50/50 would be "+money(f.half.a))+
    col("b",esc(nameOf("b"))+"'s share by income",f.ratio.b,"50/50 would be "+money(f.half.b))+
  '</div>'+

  '<div class="card" style="margin-top:14px">'+
    '<div class="label">Which way do you want to split it?</div>'+
    '<div class="inline" style="margin-top:8px">'+
      '<button class="btn '+(S.settings.split==="ratio"?"":"ghost")+'" data-act="split" data-v="ratio">Split by income</button>'+
      '<button class="btn '+(S.settings.split==="half"?"":"ghost")+'" data-act="split" data-v="half">Split down the middle</button>'+
    '</div>'+
    '<div class="note" style="margin-top:12px">Neither is more correct. Splitting by income keeps the pinch equal; '+
    'splitting down the middle keeps the arithmetic simple. Pick the one you can both live with.</div>'+
  '</div>'+

  '<div class="card '+(Math.abs(net)<0.01?"":"ours")+'" style="margin-top:14px">'+
    '<div class="label">Evening up</div>'+
    '<div class="pnum">'+settleLine+'</div>'+
    '<div class="note" style="margin-top:8px">'+esc(nameOf("a"))+' has paid '+money(f.paid.a)+' of bills and owed '+money(f.shareOfPaid.a)+' of them. '+
    esc(nameOf("b"))+' has paid '+money(f.paid.b)+' and owed '+money(f.shareOfPaid.b)+'. '+
    'Only bills you have actually marked paid count here, so the number stays right mid-month.</div>'+
  '</div>';
}

/* ---------- Where it went ---------- */
function vSpent(){
  var t=today(), from=new Date(t.getFullYear(),t.getMonth(),1);
  var f=S.spendFilter||"all";
  var rows=S.txns.filter(function(x){ return parse(x.date)>=from && (f==="all"||x.pot===f); })
                 .sort(function(a,b){ return parse(b.date)-parse(a.date); });
  var by={}; rows.forEach(function(x){ by[x.cat||"Other"]=(by[x.cat||"Other"]||0)+ +x.amount; });
  var cats=Object.keys(by).sort(function(a,b){ return by[b]-by[a]; });
  var max=cats.length?by[cats[0]]:1;
  var tot={joint:0,a:0,b:0}; rows.forEach(function(x){ tot[x.pot]=(tot[x.pot]||0)+ +x.amount; });

  function fb(v,label){ return '<button class="btn '+(f===v?"":"ghost")+' sm" data-act="filter" data-v="'+v+'">'+label+'</button>'; }
  return band("Where it went","Everything logged this month, filtered however you like.")+
  '<div class="inline" style="margin-bottom:14px">'+
    fb("all","Everything")+fb("joint","Ours")+fb("a",esc(nameOf("a"))+"'s")+fb("b",esc(nameOf("b"))+"'s")+
    '<div style="flex:1"></div>'+
  '</div>'+
  '<div class="grid g3">'+
    '<div class="card ours"><div class="label">Out of joint money</div><div class="pnum">'+money(tot.joint||0)+'</div></div>'+
    '<div class="card mine"><div class="label">'+esc(nameOf("a"))+'\'s own</div><div class="pnum" style="color:var(--a)">'+money(tot.a||0)+'</div></div>'+
    '<div class="card theirs"><div class="label">'+esc(nameOf("b"))+'\'s own</div><div class="pnum" style="color:var(--b)">'+money(tot.b||0)+'</div></div>'+
  '</div>'+
  '<div class="sechead"><h2>What each kind of spending took</h2></div>'+
  '<div class="card">'+ (cats.length? cats.map(function(c){
      return '<div class="row"><div class="gr"><div class="nm">'+esc(c)+'</div>'+
        '<div class="track"><i style="width:'+Math.round((by[c]/max)*100)+'%;background:var(--a)"></i></div></div>'+
        '<div class="amt">'+money(by[c])+'</div></div>';

  '<div class="card">'+ (rows.length? rows.map(function(x){
      var cls=x.pot==="joint"?"ours":x.pot==="a"?"mine":"theirs";

        '<div class="amt">'+money(x.amount)+'</div>'+

    }).join("") : '<div class="empty">Log your first spend on the Today screen.</div>') +'</div>';
}

function cycleLabel(s){
  if(s.cycle!=="semimonthly") return {weekly:"weekly",biweekly:"every two weeks",monthly:"monthly"}[s.cycle]||s.cycle;
  var p=semiPair(parse(s.next).getDate(),+s.day2||0);
  var day=function(n){ return n>=31?"the last day":"the "+n+ordinal(n); };
  return "twice a month, on "+day(p[0])+" and "+day(p[1]);
}
function ordinal(n){
  if(n>3&&n<21) return "th";
  return {1:"st",2:"nd",3:"rd"}[n%10]||"th";
}

var toastTimer=null;

  var el=document.getElementById("toast"); if(!el) return;
  el.textContent=msg; el.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove("on"); },2400);
}

/* ============ events ============ */
function val(id){ var e=document.getElementById(id); return e?e.value:""; }
function num(id){ return parseFloat(val(id))||0; }

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-go],[data-act]"); if(!t) return;
  if(t.dataset.go){ S.screen=t.dataset.go; render(); window.scrollTo(0,0); return; }
  var a=t.dataset.act, id=t.dataset.id;

  if(a==="quicklog"){
    var amt=num("q-amt"); if(!amt) return;
    S.txns.push({id:uid(),date:iso(today()),amount:amt,cat:val("q-cat")||"Spending",pot:val("q-pot"),by:val("q-by")||"a"});
    var pot=val("q-pot"); if(S.balances[pot]!=null) S.balances[pot]-=amt;
    render(); toast("Logged "+money(amt)+" from "+(pot==="joint"?"joint money":nameOf(pot)+"'s money"));
  }
  else if(a==="addbill"){
    if(!val("bl-n")) return;
    S.bills.push({id:uid(),name:val("bl-n"),amount:num("bl-a"),day:Math.min(28,Math.max(1,num("bl-d")||1)),
                  pot:val("bl-p"),split:val("bl-s"),pct:num("bl-p2"),owedBy:val("bl-o2"),paidBy:""});
    render();
  }
  else if(a==="delbill"){ S.bills=S.bills.filter(function(b){ return b.id!==id; }); render(); }
  else if(a==="paid"){
    var who=t.dataset.who||"a";
    var nm="";
    S.bills.forEach(function(b){ if(b.id===id){ b.paidBy=who; b.paidPeriod=period(today()); nm=b.name; } });
    render(); toast(nameOf(who)+" paid "+nm);
  }
  else if(a==="unpaid"){
    S.bills.forEach(function(b){ if(b.id===id){ b.paidBy=""; b.paidPeriod=""; } });
    render();
  }
  else if(a==="split"){ S.settings.split=t.dataset.v; render(); }
  else if(a==="explain"){ S.explain=!S.explain; render(); }
  else if(a==="filter"){ S.spendFilter=t.dataset.v; render(); }
  else if(a==="deltxn"){
    var x=S.txns.filter(function(y){ return y.id===id; })[0];
    if(x && S.balances[x.pot]!=null) S.balances[x.pot]+= +x.amount;
    S.txns=S.txns.filter(function(y){ return y.id!==id; }); render();
  }
  else if(a==="addgoal"){
    if(!val("gl-n")) return;
    var who=val("gl-o");
    S.goals.push({id:uid(),name:val("gl-n"),target:num("gl-t"),saved:num("gl-s"),monthly:num("gl-m"),
                  shared:who==="shared",owner:who==="shared"?"":who,date:""});
    render();
  }
  else if(a==="addsave"){
    var nm="", put=0;
    S.goals.forEach(function(g){
      if(g.id!==id || g.lastPaid===period(today())) return;
      var amt=+g.monthly||0;
      g.saved=(+g.saved||0)+amt;
      g.lastPaid=period(today());
      if(g.shared) S.balances.joint-=amt; else if(S.balances[g.owner]!=null) S.balances[g.owner]-=amt;
      nm=g.name; put=amt;
    });
    render(); if(nm) toast("Put "+money(put)+" into "+nm);
  }
  else if(a==="delgoal"){ S.goals=S.goals.filter(function(g){ return g.id!==id; }); render(); }
  else if(a==="adddebt"){
    if(!val("db-n")) return;
    S.debts.push({id:uid(),name:val("db-n"),balance:num("db-b"),apr:num("db-r"),min:num("db-m"),owner:val("db-o")});
    render();
  }
  else if(a==="deldebt"){ S.debts=S.debts.filter(function(d){ return d.id!==id; }); render(); }
  else if(a==="addinc"){
    if(!num("in-a")) return;
    S.income.push({id:uid(),owner:val("in-o"),label:val("in-l")||"Income",amount:num("in-a"),
                   cycle:val("in-c"),next:val("in-n")||iso(today()),day2:num("in-2")||0});
    render();
  }
  else if(a==="delinc"){ S.income=S.income.filter(function(s){ return s.id!==id; }); render(); }
  else if(a==="theme"){ S.settings.theme=t.dataset.v; render(); }
  else if(a==="loadsample"){ S=sample(); S.screen="today"; render(); }
  else if(a==="clearsample"){ var sc=S.screen; S=blank(); S.screen=sc; render(); }
  else if(a==="reset"){
    if(confirm("This erases everything in Tandem on this device. Save a copy first if you want one.")){ S=blank(); render(); }
  }
  else if(a==="print"){ window.print(); }
  else if(a==="export"){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob), link=document.createElement("a");
    link.href=url; link.download="tandem-"+iso(today())+".json"; link.click();
    setTimeout(function(){ URL.revokeObjectURL(url); },500);
  }
  else if(a==="importbtn"){ document.getElementById("importfile").click(); }
});

document.addEventListener("change",function(ev){
  if(ev.target.id==="importfile"){
    var f=ev.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{ S=Object.assign(blank(),JSON.parse(r.result)); render(); }
      catch(e){ alert("That file isn't a Tandem copy. Look for one named tandem-<date>.json."); }
    };
    r.readAsText(f);
  }
});

document.addEventListener("input",function(ev){
  var k=ev.target.dataset.set; if(!k) return;
  var v=ev.target.value;
  if(k==="name.a") S.people[0].name=v;
  else if(k==="name.b") S.people[1].name=v;
  else if(k==="bal.joint") S.balances.joint=parseFloat(v)||0;
  else if(k==="bal.a") S.balances.a=parseFloat(v)||0;
  else if(k==="bal.b") S.balances.b=parseFloat(v)||0;
  else if(k==="allow.a") S.allowance.a=parseFloat(v)||0;
  else if(k==="allow.b") S.allowance.b=parseFloat(v)||0;
  else if(k==="buffer") S.settings.buffer=parseFloat(v)||0;
  else if(k==="cur") S.settings.currency=v||"$";
  save();
});

render();
</script>
</body>
</html>
